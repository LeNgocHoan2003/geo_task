name: geo_task
description: "Location-based reminder app (Geo-Task) – geofencing and local notifications."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Location & geofencing
  geolocator: ^13.0.2
  flutter_background_geofencing: ^1.0.0
  # Maps (OpenStreetMap, no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Notifications
  flutter_local_notifications: ^18.0.1
  # Permissions
  permission_handler: ^11.3.1
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # State management
  mobx: ^2.3.0+1
  flutter_mobx: ^2.2.1+5
  # Navigation
  go_router: ^14.6.2
  # DI
  get_it: ^8.0.3
  # Utils
  uuid: ^4.5.1
  flutter_gen: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  mobx_codegen: ^2.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_logo.png

flutter_native_splash:
  color: "#ffffff"
  image: assets/app_logo.png
